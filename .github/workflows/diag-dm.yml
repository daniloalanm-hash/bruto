name: diag dailymotion (temporário)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q "yt-dlp[default,curl-cffi]" && yt-dlp --version && yt-dlp --list-impersonate-targets
      - run: |
          for v in x5ep2p4 x6eotsq x52ffnz; do
            for a in "" "--impersonate chrome" "--impersonate chrome-136" "--impersonate safari-18.4" "--impersonate safari-ios" "--referer https://www.dailymotion.com/ --impersonate chrome" "--extractor-args generic:impersonate"; do
              echo "=== $v [$a]"
              yt-dlp -F $a "https://www.dailymotion.com/video/$v" 2>&1 | grep -E "hls|http|ERROR|WARN" | awk '{print $1, $3}' | tr '\n' ' '; echo
            done
          done
          echo "=== verbose chrome"
          yt-dlp -v -F --impersonate chrome "https://www.dailymotion.com/video/x5ep2p4" 2>&1 | tail -40
